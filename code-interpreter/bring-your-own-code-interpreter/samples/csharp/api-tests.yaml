  - url: "{{base}}/files"
    name: Post File
    meta:
      id: req_fb4f969b7cb24b44875935728260ea1d
      created: 1753210167273
      modified: 1753219338775
      isPrivate: false
      description: ""
      sortKey: -1753141165407
    method: POST
    body:
      mimeType: ""
      text: "{{ mp_body }}"
    parameters:
      - name: identifier
        value: "{{id}}"
        disabled: false
        id: pair_ad3f59b77a3f4eb58af6794bfc0ae9bd
      - name: api-version
        value: "{{api}}"
        disabled: false
        id: pair_3a56cd02c9104bfb9ff699330cdd38a8
      - name: path
        value: /
        disabled: false
        id: pair_2a6e90fc537b497aa9e171c851d35c33
    headers:
      - name: Content-Type
        value: multipart/form-data; boundary={{ mp_boundary }}
        id: pair_b6f55b8fc6c84d45a2164c53d7b97865
      - name: User-Agent
        value: insomnia/11.3.0
        id: pair_e65a9d01018049ba8840905f54955394
      - name: Authorization
        value: Bearer {{ token }}
        id: pair_0dde27baa3624541bfb6211ae562db57
    scripts:
      preRequest: >-
        (function () {
          var CRLF = '\r\n';

          // Pull file content + name from env
          var filename = insomnia.environment.get('sampleFileName') || 'sample.txt';
          var content  = insomnia.environment.get('sampleTxt') || '';

          // Any extra text fields you want in the form body
          var extra = {
            identifier: insomnia.environment.get('id') || 'test-session'
            // path: '/',  // if your API wants it in body instead of query
          };

          // Build unique boundary
          var boundary = '----mp-' + Date.now();

          // Build body string
          var body = '';
          // file part
          body += '--' + boundary + CRLF;
          body += 'Content-Disposition: form-data; name="file"; filename="' + filename + '"' + CRLF;
          body += 'Content-Type: text/plain' + CRLF + CRLF;
          body += content + CRLF;

          // extra fields
          Object.keys(extra).forEach(function (k) {
            body += '--' + boundary + CRLF;
            body += 'Content-Disposition: form-data; name="' + k + '"' + CRLF + CRLF;
            body += String(extra[k] || '') + CRLF;
          });

          // closing boundary
          body += '--' + boundary + '--' + CRLF;

          // Save to env
          insomnia.environment.set('mp_boundary', boundary);
          insomnia.environment.set('mp_body', body);
        })();
      afterResponse: |-
        const jsonBody = insomnia.response.json();
        insomnia.environment.set("fileName", jsonBody.name);
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
